name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            build_args: --mac --arm64 --x64
            artifact: narada-mac
          - os: windows-2025
            platform: win
            build_args: --win --x64
            artifact: narada-win-x64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.artifact }})

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      # The updater manifests carry package.json's version; the tag must match.
      - name: Check tag matches package.json version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Provision Firebase service account
        shell: bash
        run: echo "$FIREBASE_SA_JSON" | base64 -d > resources/firebase-sa.json
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}

      - name: Set Firebase env for build
        shell: bash
        run: echo "FIREBASE_SERVICE_ACCOUNT_BASE64=${FIREBASE_SA_JSON}" >> $GITHUB_ENV
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}

      - name: Build Next.js
        run: npm run build

      - name: Fix Turbopack hashed module names
        run: node scripts/fix-turbopack-hashes.mjs

      - name: Copy static assets into standalone
        shell: bash
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Compile Electron TypeScript
        run: npm run electron:compile

      # Signed + notarized macOS build. Apple credentials are scoped to this step
      # only; forceCodeSigning makes electron-builder fail instead of producing
      # an unsigned app if the certificate can't be used.
      - name: Check macOS signing secrets
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name — refusing to build an unsigned macOS release"
              missing=1
            fi
          done
          exit $missing

      - name: Build Electron app (macOS, signed + notarized)
        if: matrix.platform == 'mac'
        run: npx electron-builder ${{ matrix.build_args }} --publish never -c.forceCodeSigning=true
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # electron-builder only warns when notarization is skipped, so prove the
      # shipped apps (and the copies inside the updater ZIPs) are signed,
      # notarized and stapled before anything is uploaded.
      - name: Verify macOS signature, notarization and stapling
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            codesign --verify --deep --strict --verbose=2 "$1"
            spctl --assess --type execute --verbose=4 "$1"
            xcrun stapler validate "$1"
          }
          for app in dist/mac*/"Narad Muni.app"; do
            echo "== $app"; verify "$app"
          done
          for zip in dist/*.zip; do
            tmp=$(mktemp -d)
            ditto -x -k "$zip" "$tmp"
            echo "== $zip"; verify "$tmp/Narad Muni.app"
            rm -rf "$tmp"
          done
          version=$(node -p "require('./package.json').version")
          grep -q "^version: $version$" dist/latest-mac.yml
          grep -q -- "-$version-arm64.zip" dist/latest-mac.yml
          grep -q -- "-$version-x64.zip" dist/latest-mac.yml

      - name: Build Electron app (Windows)
        if: matrix.platform == 'win'
        run: npx electron-builder ${{ matrix.build_args }} --publish never

      - name: Verify Windows update manifest
        if: matrix.platform == 'win'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          grep -q "^version: $version$" dist/latest.yml

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -30

      - name: Check update manifests are present
        run: test -f artifacts/latest-mac.yml && test -f artifacts/latest.yml

      # Upload everything to a draft first, then publish, so installed apps never
      # see a release whose updater manifests or ZIPs are still uploading.
      - name: Create GitHub Release (draft)
        id: release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/latest*.yml
            artifacts/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
