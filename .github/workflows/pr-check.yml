name: PR Check

# Validation only: no signing secrets, no packaging, no publishing.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile Electron TypeScript
        run: npm run electron:compile

      - name: Type-check app
        run: npx tsc --noEmit

      - name: Updater tests
        run: npx tsx electron/updater.test.ts

      - name: Network tests
        run: |
          npx tsx electron/net-fetch.test.ts
          npx tsx src/lib/utils.test.ts

      - name: Settings tests
        run: npx tsx src/lib/ai-settings.test.ts

      - name: Worklog tests
        run: |
          npx tsx src/lib/ai/time-rules.test.ts
          npx tsx src/lib/ai/project-rules.test.ts
          npx tsx src/lib/ai/prompt.test.ts
          npx tsx src/lib/jira-adf.test.ts

      - name: Changelog tests
        run: node scripts/changelog.test.mjs
