name: PR Check

# Validation only: no signing secrets, no packaging, no publishing.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile Electron TypeScript
        run: npm run electron:compile

      - name: Type-check app
        run: npx tsc --noEmit

      - name: Updater tests
        run: npx tsx electron/updater.test.ts

      - name: Changelog tests
        run: node scripts/changelog.test.mjs
